name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Verify version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag $TAG does not match package version $VER"
            exit 1
          fi
      - name: Pack stable tarball
        run: |
          npm pack --ignore-scripts
          mv dsh-archived-conversation-*.tgz dsh-archived-conversation.tgz
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(sed "s/vX.Y.Z/${GITHUB_REF_NAME}/g" .github/release_template.md)"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dsh-archived-conversation.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dsh-archived-conversation.tgz \
              --title "${GITHUB_REF_NAME}" \
              --notes "$NOTES"
          fi
